[project]
name = "book-examples"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify

]
ignore = [
    "E501",   # line too long (교육용 코드에서 유연하게)
    "E402",   # module-level import not at top (교육용 순서 의도적)
    "E701",   # multiple statements on one line
    "E702",   # multiple statements on one line (semicolon)
    "E741",   # ambiguous variable name (수학 코드에서 l, O 등 사용)
    "F401",   # unused import (교육용 re-export 패턴)
    "F403",   # star import used
    "F405",   # undefined name from star import
    "F706",   # return outside function (materializer가 함수 내부만 추출한 결과)
    "F811",   # redefined name (교육용 예제에서 재정의로 개념 설명)
    "F821",   # undefined name (교육용 스니펫은 article 맥락에서 정의된 이름 참조)
    "W292",   # no newline at end of file
    "B008",   # function call in default arg (FastAPI pattern)
    "B011",   # assert False (교육용 테스트 패턴)
    "B023",   # function uses loop variable (교육용 예제)
    "SIM102", # collapsible if (가독성 우선)
    "SIM108", # ternary operator (가독성 우선)
    "UP035",  # typing.List/Dict deprecated (교육용 코드에서 명시적 타입 힌트 보존)
    "B904",   # raise from (교육용 예제에서 간결성 우선)
    "B018",   # useless expression (교육용: 표현식 결과 시연)
    "SIM105", # contextlib.suppress (교육용: try/except pass 패턴 명시)
    "SIM117", # combine with statements (교육용: 단계별 with 분리)
    "F601",   # membership test with list (교육용: 명시적 리스트 사용)
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
